# ftags language profile: TypeScript / JavaScript (langs.md §TypeScript)
# Declarative KEY=VALUE, parsed as data; never sourced.
# Uses AST scanner (scan-ts.mjs) instead of regex scanner (scan.awk).
# DECL_RE, TAG_TARGET_RE, DECL_NAME_STRIP, TEST_RE, TEST_NAME_STRIP, TEST_NAME_END
# are not used by the AST scanner and set to empty.
NAME=ts
FILES=*.ts *.tsx *.js *.jsx
EXCLUDE=*.d.ts *.generated.* node_modules/* dist/* build/*
COMMENT=//
GAP_RE='^[[:space:]]*//'
SCANNER=scan-ts.mjs
DECL_RE=
TAG_TARGET_RE=
DECL_NAME_STRIP=
FLOW_DECL_RE=
FEAT_DECL_RE=
BRANCH_RE='^[[:space:]]*(case .*:|default:)[[:space:]]*$'
FIELD_OPEN_RE=
FIELD_CLOSE_RE=
HEADER_RE='^import '
TEST_FILES=*.test.ts *.test.tsx *.spec.ts *.spec.tsx *.test.js *.test.jsx *.spec.js *.spec.jsx
TEST_RE=
TEST_NAME_STRIP=
TEST_NAME_END=
RUN_CMD='npx jest -t "{TESTS}"'
RUN_JOIN=|
EVIDENCE_CMD=
