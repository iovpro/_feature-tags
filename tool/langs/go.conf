# ftags language profile: Go (langs.md §Go)
# Declarative KEY=VALUE, parsed as data; never sourced.
# Quoted values are taken verbatim (no escape processing).
NAME=go
FILES=*.go
EXCLUDE=*_gen.go docs/docs.go vendor/*
COMMENT=//
GAP_RE='^[[:space:]]*//'
DECL_RE='^(func|type|const|var) '
TAG_TARGET_RE=
DECL_NAME_STRIP='^(func( \([^)]*\))?|type|const|var) '
FLOW_DECL_RE='^func '
FEAT_DECL_RE='^(type|const|var) '
BRANCH_RE='^[[:space:]]*(case .*:|default:|(} else )?if .*\{|} else \{)[[:space:]]*$'
FIELD_OPEN_RE='^type .* (struct|interface) \{'
FIELD_CLOSE_RE='^\}'
HEADER_RE='^(package|import) '
TEST_FILES=*_test.go
TEST_RE='^func Test[A-Za-z0-9_]*\('
TEST_NAME_STRIP='^func '
TEST_NAME_END='\(.*$'
RUN_CMD='go test -race ./... -run "^({TESTS})$"'
RUN_JOIN=|
EVIDENCE_CMD=
