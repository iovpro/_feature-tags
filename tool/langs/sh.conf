# ftags language profile: shell scripts and bats tests (langs.md §Shell)
# Declarative KEY=VALUE, parsed as data; never sourced.
# Quoted values are taken verbatim (no escape processing).
NAME=sh
FILES=*.sh *.bash *.bats
EXCLUDE=
COMMENT=#
GAP_RE='^[[:space:]]*#'
DECL_RE='^([A-Za-z_][A-Za-z0-9_]*[[:space:]]*\(\)|function [A-Za-z_]|@test ")'
TAG_TARGET_RE='^[^#[:space:]}]'
DECL_NAME_STRIP='^function '
FLOW_DECL_RE=
FEAT_DECL_RE=
BRANCH_RE='^[[:space:]]*([^#()]+\)|(if|elif|else|then)([[:space:]].*)?)[[:space:]]*$'
FIELD_OPEN_RE=
FIELD_CLOSE_RE=
HEADER_RE=
TEST_FILES=*.bats
TEST_RE='^@test "'
TEST_NAME_STRIP='^@test "'
TEST_NAME_END='".*$'
RUN_CMD='bats -f "{TESTS}" tests/'
RUN_JOIN=|
EVIDENCE_CMD=
