# ftags language profile: YAML, docker-compose, Kubernetes manifests, Dockerfile (langs.md §YAML)
# Declarative KEY=VALUE, parsed as data; never sourced.
# Quoted values are taken verbatim (no escape processing).
NAME=yaml
FILES=*.yml *.yaml Dockerfile*
EXCLUDE=
COMMENT=#
GAP_RE='^[[:space:]]*#'
DECL_RE='^[[:space:]]*(-[[:space:]]+)?([A-Za-z0-9_.-]+:([[:space:]]|$)|---|FROM )'
TAG_TARGET_RE=
DECL_NAME_STRIP='^[[:space:]]*(-[[:space:]]+)?'
FLOW_DECL_RE=
FEAT_DECL_RE=
BRANCH_RE=
FIELD_OPEN_RE=
FIELD_CLOSE_RE=
HEADER_RE=
TEST_FILES=
TEST_RE=
TEST_NAME_STRIP=
TEST_NAME_END=
RUN_CMD=
RUN_JOIN=
EVIDENCE_CMD='docker compose down && docker compose build && docker compose up -d && sleep 5; verify services healthy; docker compose logs without ERROR/panic'
